[app]
port = 5000
fullscreen = false

# Key to silently exit the application. Supports modifiers: e.g. "ctrl+shift+q" or "%"
secret_exit_key = "ctrl+shift+q"

[display]
# Seconds of inactivity in the registration form before returning to advertising mode
idle_timeout_seconds = 45

[data]
csv_path = "registrations.csv"
backup_dir = "backups"
backup_interval_minutes = 60

[offer]
title = "Free Development Board"
subtitle = "Be among the first to get your hands on the Apitronix dev kit — free for early adopters."
cta = "Press any key to register your interest"
